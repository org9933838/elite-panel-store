
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Panel | ডিজিটাল স্টোর</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="logo">ELITE <span>PANEL</span></div>
    <p>আপনার বিশ্বস্ত ডিজিটাল সেবা কেন্দ্র</p>
  </header>

  <main>
    <section class="hero">
      <h1>স্বাগতম Elite Panel-এ</h1>
      <p>সহজে পছন্দের ডিজিটাল পণ্য বেছে নিন এবং অর্ডার করুন।</p>
    </section>

    <section class="products">
      <h2>আমাদের প্যাকেজসমূহ</h2>
      <div id="product-list"></div>
    </section>

    <section id="checkout" class="checkout hidden">
      <h2>আপনার অর্ডার</h2>
      <div id="selected-product"></div>
      <label for="customer-name">আপনার নাম</label>
      <input id="customer-name" placeholder="সম্পূর্ণ নাম">
      <label for="customer-phone">মোবাইল নম্বর</label>
      <input id="customer-phone" placeholder="01XXXXXXXXX">
      <button id="pay-button">পেমেন্ট করুন</button>
      <p id="message"></p>
    </section>
  </main>

  <footer>© ২০২৬ Elite Panel — সর্বস্বত্ব সংরক্ষিত</footer>
  <script src="/script.js"></script>
</body>
</html>
